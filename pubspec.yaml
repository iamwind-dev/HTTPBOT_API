name: http_client
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^16.2.1
  dio: ^5.9.0
  get_it: ^8.2.0
  equatable: ^2.0.7
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  app_links: 7.0.0
  url_launcher: ^6.3.2
  xml: ^6.5.0
  
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  file_picker: ^11.0.2
  share_plus: ^11.0.0
  yaml: ^3.1.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13 
  freezed: ^3.2.0
  json_serializable: ^6.7.1
  auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.4.0
  intl_utils: ^2.8.7
  injectable_generator: ^2.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto/Roboto-Thin.ttf

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: dot-delimiter
  fonts:
    enabled: true
  colors:
    enabled: true
    inputs:
      - assets/color/colors.xml

flutter_intl:
  enabled: true
  main_locale: "en"
  arb_dir: assets/l10n
  output_dir: lib/generated

